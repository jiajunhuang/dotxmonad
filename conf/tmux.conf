unbind C-b
unbind-key -n C-a
set-option -g prefix C-x
bind-key C-x send-prefix

# split panes using \(because my keyboard default is '\' but not '|') and -
unbind '"'
unbind %
bind '\' split-window -h
bind '-' split-window -v

# use C-x hjkl to switch focus panes
unbind h
unbind l
unbind j
unbind k
bind h select-pane -L
bind l select-pane -R
bind j select-pane -U
bind k select-pane -D

# reload
bind R source-file ~/.tmux.conf \; display-message "Config reloaded..."

# vi-like
setw -g mode-keys vi
bind-key -T copy-mode-vi 'v' send-keys -X begin-selection
bind-key -T copy-mode-vi 'y' send-keys -X copy-selection

# limit history to 10000
set-option -g history-limit 10000

# Esc response time. for neovim
set-option -g escape-time 10

# colorscheme and lookfeel
set-option -g default-terminal "screen-256color"  # for neovim

# panes
set-option -g pane-border-style fg=colour238
set-option -g pane-active-border-style fg=colour166

# Byobu-like status bar, using plain text so no special font is required.
set-option -g status on
set-option -g status-position bottom
set-option -g status-interval 5
set-option -g status-style 'bg=colour236,fg=colour255'
set-option -g status-justify left
set-option -g status-left-length 40
set-option -g status-right-length 80

# Session badge and indicators for prefix / copy mode.
set-option -g status-left '#[bg=colour166,fg=colour255,bold] #S #[default] #{?client_prefix,#[bg=colour220]#[fg=colour234] PREFIX #[default] ,}#{?pane_in_mode,#[bg=colour96]#[fg=colour255] COPY #[default] ,}'

# Window list: number, title and tmux flags (* current, - previous, ! activity).
set-window-option -g window-status-separator ' '
set-window-option -g window-status-format ' #I:#W#F '
set-window-option -g window-status-current-format '#[bg=colour255,fg=colour236,bold] #I:#W#F '
set-window-option -g window-status-activity-style 'fg=colour220,bold'
set-window-option -g window-status-bell-style 'fg=colour203,bold'
set-window-option -g monitor-activity on
set-option -g visual-activity off

# Byobu's dark/white window list, yellow load and a single date/time block.
# Keep the shell command outside conditionals and avoid awk $ expansion.
# Extract the one-minute load from either Linux or macOS uptime output.
set-option -g status-right '#[bg=colour96,fg=colour255] #h #[bg=colour220,fg=colour234] load #(LC_ALL=C uptime | sed -E "s/.*load averages?: *//; s/[^0-9.].*//") #[bg=colour70,fg=colour234] mem #(sh "$HOME/.xmonad/conf/tmux-memory.sh") #[bg=colour236,fg=colour255] %Y-%m-%d %H:%M '

# Match command prompts and copy selections to the status bar.
set-option -g message-style 'bg=colour96,fg=colour255'
set-option -g message-command-style 'bg=colour238,fg=colour255'
set-window-option -g mode-style 'bg=colour96,fg=colour255'
